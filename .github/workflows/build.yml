# Builds the agent-home image, checks it before publishing, attests provenance
# and uploads a generated REFERENCE.md. Every Monday after the sandbox image it is built on, on
# every push to main, and by hand. A pull request builds it without pushing.
#
# Tags: `latest` and `<date>` (`<date>.2` for a second build that day). A date tag never moves;
# `latest` follows the newest build.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ['REFERENCE.md']
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/briq-cloud/agent-home
  CODEX_VERSION: 0.166.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The runner's checks before anything is built: its types, then its tests against a mock agent.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the runner
        working-directory: runner
        run: |
          npm ci --omit=optional --no-fund --no-audit
          RUNNER_CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export RUNNER_CHROME_BIN
          test -x "$RUNNER_CHROME_BIN"
          npm run typecheck
          npm test
          npm run benchmark -- /tmp/foundation-results.json
          node --check src/ui/web/home.js
          cd ../benchmarks
          npm ci --no-fund --no-audit
          npm test
          npm run mock
          BENCH_SUITE=medium npm run mock

      - name: Check release resolution
        run: node --test bin/resolve-gh-release.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: foundation-benchmark
          path: /tmp/foundation-results.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A date tag never moves: a second build the same day takes `<date>.<n>`.
      - id: date
        run: |
          set -eu
          d="$(date -u +%Y-%m-%d)" t="$d" n=1
          while docker buildx imagetools inspect "$IMAGE:$t" > /dev/null 2>&1; do n=$((n + 1)); t="$d.$n"; done
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      # Each CLI's current stable release (Codex uses Agent Home's compatibility pin) and the
      # GitHub assets' digests, resolved once here (with
      # the job's token: unauthenticated GitHub API calls are rate-limited) and passed in, so the
      # image has exactly these; the base by digest, so the image says which one it is built on.
      - name: Resolve the versions
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          codex_version="$CODEX_VERSION"
          codex_release="$(node bin/resolve-gh-release.mjs openai/codex rust-v codex-package-x86_64-unknown-linux-musl.tar.gz "$codex_version")"
          copilot_release="$(node bin/resolve-gh-release.mjs github/copilot-cli v copilot-linux-x64.tar.gz)"
          read -r codex codex_sha256 <<< "$codex_release"
          read -r copilot copilot_sha256 <<< "$copilot_release"
          base="ghcr.io/briq-cloud/sandbox@$(docker buildx imagetools inspect ghcr.io/briq-cloud/sandbox:latest --format '{{json .Manifest}}' | jq -r .digest)"
          {
            echo "base=$base"
            echo "claude=$(curl -fsSL https://downloads.claude.ai/claude-code-releases/stable)"
            echo "codex=$codex"
            echo "codex_sha256=$codex_sha256"
            echo "copilot=$copilot"
            echo "copilot_sha256=$copilot_sha256"
            echo "cursor=$(curl -fsSL https://cursor.com/install | grep -oE 'lab/[0-9.]+-[0-9a-f]+' | head -n 1 | cut -d/ -f2)"
            echo "grok=$(curl -fsSL https://x.ai/cli/stable)"
            echo "vibe=$(curl -fsSL https://pypi.org/pypi/mistral-vibe/json | jq -r .info.version)"
            gemini="$(npm view @google/gemini-cli version)"
            echo "gemini=$gemini"
            echo "gemini_integrity=$(npm view "@google/gemini-cli@$gemini" dist.integrity)"
            echo "ttyd=$(gh api repos/tsl0922/ttyd/releases/latest --jq .tag_name)"
          } | tee -a "$GITHUB_OUTPUT"

      # One manifest, as Fly pulls it: the provenance is attested on GitHub below, not pushed as an
      # attestation manifest beside the image.
      - name: Build Agent Home
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent-home
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          build-args: |
            BASE=${{ steps.v.outputs.base }}
            CLAUDE_VERSION=${{ steps.v.outputs.claude }}
            CODEX_VERSION=${{ steps.v.outputs.codex }}
            CODEX_SHA256=${{ steps.v.outputs.codex_sha256 }}
            COPILOT_VERSION=${{ steps.v.outputs.copilot }}
            COPILOT_SHA256=${{ steps.v.outputs.copilot_sha256 }}
            CURSOR_VERSION=${{ steps.v.outputs.cursor }}
            GROK_VERSION=${{ steps.v.outputs.grok }}
            VIBE_VERSION=${{ steps.v.outputs.vibe }}
            GEMINI_VERSION=${{ steps.v.outputs.gemini }}
            GEMINI_INTEGRITY=${{ steps.v.outputs.gemini_integrity }}
            TTYD_VERSION=${{ steps.v.outputs.ttyd }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
          cache-from: type=gha,scope=images
          cache-to: type=gha,mode=max,scope=images

      - name: Standalone startup smoke test
        run: |
          set -eu
          docker run -d --name agent-home-smoke -e RUNNER_TOKEN=ci-smoke -e RUNNER_CLIS='[]' "$IMAGE:${{ steps.date.outputs.tag }}"
          trap 'docker logs agent-home-smoke; docker rm -f agent-home-smoke' EXIT
          for _ in $(seq 1 30); do
            docker exec agent-home-smoke node -e "fetch('http://127.0.0.1:8090/features',{headers:{authorization:'Bearer ci-smoke'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 1
          done
          docker exec agent-home-smoke node -e "fetch('http://127.0.0.1:8090/terminal/',{headers:{authorization:'Bearer ci-smoke'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker exec agent-home-smoke sh -c 'test ! -e /opt/t3 && test -e /opt/agent-home-runner'
          docker exec agent-home-smoke sh -c 'test "$(codex --version)" = "codex-cli $(cat /etc/agent-home/codex-version)"'

      - name: Publish the checked image
        id: publish
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          docker push "$IMAGE:${{ steps.date.outputs.tag }}"
          docker push "$IMAGE:latest"
          digest="$(docker buildx imagetools inspect "$IMAGE:${{ steps.date.outputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}

      - name: Write the reference from the image
        run: |
          set -eu
          t="${{ steps.date.outputs.tag }}"
          docker run --rm "$IMAGE:$t" agent-home-versions > REFERENCE.md
          [ "${{ github.event_name }}" = pull_request ] && { cat REFERENCE.md >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          mb="$(docker manifest inspect "$IMAGE:$t" | jq '[.layers[].size] | add / 1048576 | round')"
          # Markdown backticks are literal output.
          # shellcheck disable=SC2016
          printf '\n## Image\n\n`%s:%s`, %s MB compressed, digest `%s`, on `%s`. The Dockerfile: [Dockerfile](Dockerfile). Its provenance: `gh attestation verify oci://%s:%s --repo briq-cloud/agent-home`.\n' \
            "$IMAGE" "$t" "$mb" "${{ steps.publish.outputs.digest }}" "${{ steps.v.outputs.base }}" "$IMAGE" "$t" >> REFERENCE.md
          cat REFERENCE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the generated reference
        uses: actions/upload-artifact@v4
        with:
          name: agent-home-reference
          path: REFERENCE.md
          if-no-files-found: error
